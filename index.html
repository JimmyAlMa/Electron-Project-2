<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Mini POS</title>
</head>
<body>
    <nav>
        <h1 id="title">Mini POS</h1>
        <div id="navSubContainer">
            <h2 class="stockNav">Stock</h2>
            <h2 class="transactionNav">Transaction</h2>
            <h2 class="historyNav">History</h2>
        </div>
    </nav>

    <div id="stockContainer">
        <div id="leftStockContainer">
            <input type="text" id="stockInputProduct" class="stockInput" placeholder="Product name...">
            <input type="number" id="stockInputPrice" class="stockInput" placeholder="Price (Rupiah)...">
            <input type="number" id="stockInputTotal" class="stockInput" placeholder="Total product...">

            <button onclick="addStock()" id="stockButton">ADD</button>
        </div>
        <div id="rightStockContainer">
            <ul class="stockList">

            </ul>
        </div>
    </div>

    <div id="cashierContainer">
        <div id="leftCashierContainer">
            <h2>Item Stock:</h2>
            <div id="itemStockContainer">
                <ul class="stockList"></ul>
                    
            </div>
        </div>
        <div id="rightCashierContainer">
            <div id="cartItemsContainer">
                <ul id="cartList">

                </ul>
            </div>
            <div id="cartSummaryContainer">
                <p>Total: Rp 0</p>
                <button id="payButton">Pay</button>
            </div>
        </div>
    </div>
    
    <div id="historyContainer">
        <ul id="historyList">

        </ul>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
