<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Mini POS</title>
</head>
<body>
    <nav>
        <h1 id="title">Mini POS</h1>
        <div id="subContainer">
            <h2>Stock</h2>
            <h2>Transaction</h2>
            <h2>History</h2>
        </div>
    </nav>

    <div id="stockContainer">
        <div id="leftStockContainer">
            <input type="text" id="stockInputProduct" class="stockInput" placeholder="Product name...">
            <input type="number" id="stockInputPrice" class="stockInput" placeholder="Price (Dollar)...">
            <input type="number" id="stockInputTotal" class="stockInput" placeholder="Total product...">

            <button onclick="addStock()" id="stockButton">ADD</button>
        </div>
        <div id="rightStockContainer">
            <ul id="stockList">
                
            </ul>
        </div>
    </div>

    <div id="transactionContainer"></div>
    
    <div id="historyContainer"></div>

    <script src="renderer.js"></script>
</body>
</html>
